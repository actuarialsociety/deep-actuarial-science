  paper: "Gabrielli, Richman & Wüthrich (2020), Neural network embedding of the over-dispersed Poisson reserving model, Scandinavian Actuarial Journal"
  doi: 10.1080/03461238.2019.1633394
  items:
    - what: "Paper text"
      paper: "not in the local research library (no open-access copy found)"
      where: "`scripts/research.py status`"
      ours: "built from the paper's idea only, so it is described as \"in the spirit of\" the paper"
      code: models/reserving.py::NeuralODP
      status: open
      note: "Add the PDF to data/12_research/manual/ to check it line by line."
    - what: "Idea"
      paper: "a neural network embedding of the over-dispersed Poisson reserving model"
      where: "title"
      ours: "chain-ladder mean as offset; embeddings of company, line and development year; zero start"
      code: models/reserving.py::NeuralODP
      status: open
    - what: "Network"
      paper: "not read"
      where: "-"
      param: reserving.models.neural_odp.hidden
      value: [16, 8]
      status: open
    - what: "Number of epochs"
      paper: "not read"
      where: "-"
      ours: "chosen out of time (train to 1996, validate on the 1997 diagonal), then a refit"
      code: models/reserving.py::neural_odp
      status: open
    - what: "Published benchmark"
      paper: "none on Schedule P"
      where: "-"
      ours: "back-tested against the realised lower triangle and compared with chain-ladder"
      code: models/reserving.py::reserves
      status: open
